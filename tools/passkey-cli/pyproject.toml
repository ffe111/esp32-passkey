[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "esp32-passkey-cli"
version = "0.1.0"
description = "Free, open-source manager for ESP32 FIDO2 passkeys (Pico FIDO firmware)"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.10"
dependencies = [
    "fido2>=2.2,<3",
    "pyserial>=3.5",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
passkey-cli = "passkey_cli.cli:main"

[tool.setuptools]
packages = ["passkey_cli"]
