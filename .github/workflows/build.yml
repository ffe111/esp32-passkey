name: Build and test

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-24.04
    strategy:
      # One chip failing should not cancel the others (keeps every result visible).
      fail-fast: false
      matrix:
        # s3/s2: native USB security key. esp32/c3/c6: serial transport (no USB OTG).
        target: [esp32s3, esp32s2, esp32, esp32c3, esp32c6]
        variant: [""]
        include:
          # Test-only images for QEMU, which has no BOOT button. Never released.
          - target: esp32
            variant: _nobutton
          - target: esp32c3
            variant: _nobutton
    container: espressif/idf:v5.5.4
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Build ${{ matrix.target }}${{ matrix.variant }}
        shell: bash
        env:
          # Set these repository variables once you own a VID/PID (https://pid.codes).
          USB_VID: ${{ vars.USB_VID }}
          USB_PID: ${{ vars.USB_PID }}
          REQUIRE_BUTTON: ${{ matrix.variant == '_nobutton' && '0' || '1' }}
        run: |
          . $IDF_PATH/export.sh
          SRC_ROOT="$GITHUB_WORKSPACE" bash firmware/build.sh ${{ matrix.target }} "$GITHUB_WORKSPACE/dist"
      - uses: actions/upload-artifact@v4
        with:
          name: passkey_${{ matrix.target }}${{ matrix.variant }}
          path: dist/passkey_${{ matrix.target }}${{ matrix.variant }}.bin

  cli-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: |
          pip install -e "tools/passkey-cli[test]"
          pytest -q tools/passkey-cli/tests
          (cd tools/uhid-bridge && pytest -q test_uhid_bridge.py)
      - name: Build emulator
        run: docker build -f emulator/Dockerfile -t esp32-passkey-emulator .
      - name: End-to-end against emulator
        run: |
          docker run -d --name emu -p 35962:35962 esp32-passkey-emulator
          # Don't probe the port: the emulator serves one client at a time, and a
          # probe (`echo > /dev/tcp/...`) leaves it stuck on a stray byte from a
          # closed connection, so every test then times out. Wait for its log line.
          for i in $(seq 1 60); do docker logs emu 2>&1 | grep -q "HID server listening" && break; sleep 1; done
          docker logs emu 2>&1 | grep "HID server listening"
          PASSKEY_DEVICE=tcp:127.0.0.1:35962 pytest -q tools/passkey-cli/tests/test_e2e_emulator.py
      - if: always()
        run: docker logs emu || true

  serial-qemu:
    # Real serial-transport firmware in Espressif QEMU, driven by passkey-cli.
    needs: firmware
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [esp32, esp32c3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "tools/passkey-cli[test]"
      - uses: actions/download-artifact@v4
        with:
          name: passkey_${{ matrix.target }}_nobutton
          path: dist
      - name: Start QEMU
        run: |
          docker run -d --name qemu -p 5555:5555 -v "$PWD:/src" espressif/idf:v5.5.4 \
            bash -c "tr -d '\r' < /src/emulator/qemu-esp32.sh > /tmp/q.sh && QEMU_TARGET=${{ matrix.target }} FIRMWARE=/src/dist/passkey_${{ matrix.target }}_nobutton.bin bash /tmp/q.sh"
          for i in $(seq 1 120); do docker exec qemu pgrep qemu-system && break; sleep 2; done
          sleep 10
      - name: End-to-end over serial
        run: PASSKEY_DEVICE=socket://127.0.0.1:5555 pytest -q tools/passkey-cli/tests/test_e2e_emulator.py
      - if: always()
        run: docker logs qemu | tail -n 50 || true

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [firmware, cli-tests, serial-qemu]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Drop test-only images
        run: rm -f dist/*_nobutton.bin
      - name: Assemble web flasher
        run: cp dist/*.bin web-flasher/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web-flasher
      - uses: actions/deploy-pages@v4
      - name: Attach binaries to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.bin --generate-notes
